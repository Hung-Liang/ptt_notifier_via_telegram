[project]
name = "ptt-notifier-via-telegram"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "apscheduler>=3.11.3,<4",
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.3",
    "python-dotenv>=1.2.4",
    "python-telegram-bot>=22.8",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 79
target-version = "py314"

[tool.ruff.lint]
# Correctness-focused rules only; style rules are left out to avoid churn
select = ["E4", "E7", "E9", "F", "B"]

[tool.ruff.format]
quote-style = "single"
